
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Chatbot</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f0f4f9;
    color: #222;
}

.app {
    max-width: 850px;
    height: 100dvh;
    margin: auto;
    background: white;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 20px #0001;
}

header {
    background: #202c45;
    color: white;
    padding: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

header h2 {
    margin: 0 0 5px;
}

header p {
    margin: 0;
    color: #c9d4e8;
    font-size: 13px;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 14px;
}

.new-chat {
    background: #fff;
    color: #202c45;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    margin: 12px 0;
    display: flex;
}

.user {
    justify-content: flex-end;
}

.bot {
    justify-content: flex-start;
}

.bubble {
    max-width: 85%;
    padding: 13px 16px;
    border-radius: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user .bubble {
    background: #315efb;
    color: white;
    border-bottom-right-radius: 4px;
}

.bot .bubble {
    background: #eef1f7;
    color: #222;
    border-bottom-left-radius: 4px;
}

.welcome {
    text-align: center;
    margin: 60px 0;
    color: #64748b;
}

.welcome h2 {
    color: #202c45;
}

footer {
    border-top: 1px solid #e5e7eb;
    padding: 15px;
}

#chatForm {
    display: flex;
    gap: 10px;
}

#question {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

#question:focus {
    border-color: #315efb;
}

#send {
    background: #315efb;
    color: white;
}

#send:disabled {
    opacity: 0.6;
    cursor: wait;
}

.note {
    text-align: center;
    font-size: 12px;
    color: #64748b;
    margin: 10px 0 0;
}

@media (max-width: 500px) {
    header {
        padding: 14px;
    }

    header h2 {
        font-size: 19px;
    }

    .new-chat {
        padding: 10px;
    }

    #messages {
        padding: 14px;
    }

    footer {
        padding: 10px;
    }
}
</style>
</head>

<body>
<div class="app">

    <header>
        <div>
            <h2>🤖 My AI Chatbot</h2>
            <p>Powered by Groq AI</p>
        </div>
        <button class="new-chat" id="newChat">+ New Chat</button>
    </header>

    <main id="messages">
        <div class="welcome" id="welcome">
            <h2>How can I help you?</h2>
            <p>Ask me anything to get started.</p>
        </div>
    </main>

    <footer>
        <form id="chatForm">
            <input
                id="question"
                type="text"
                placeholder="Message your AI..."
                autocomplete="off"
                required
            >
            <button id="send" type="submit">Send ➤</button>
        </form>
        <p class="note">
            Demo mode: API key ko sirf trusted device par enter karein.
            Public website par key expose na karein.
        </p>
    </footer>

</div>

<script>
const messagesBox = document.getElementById("messages");
const form = document.getElementById("chatForm");
const input = document.getElementById("question");
const sendButton = document.getElementById("send");
const newChatButton = document.getElementById("newChat");

let chatHistory = [];
let apiKey = "";

function addMessage(text, sender) {
    const row = document.createElement("div");
    row.className = "message " + sender;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    // Display text safely; do not interpret AI output as HTML.
    bubble.textContent = text;

    row.appendChild(bubble);
    messagesBox.appendChild(row);
    messagesBox.scrollTop = messagesBox.scrollHeight;

    return bubble;
}

function showWelcome() {
    const welcome = document.createElement("div");
    welcome.className = "welcome";
    welcome.id = "welcome";
    welcome.innerHTML =
        "<h2>How can I help you?</h2>" +
        "<p>Ask me anything to get started.</p>";

    messagesBox.appendChild(welcome);
}

function getApiKey() {
    if (apiKey) return apiKey;

    const enteredKey = prompt(
        "Apni Groq API key enter karein. " +
        "Sirf trusted device par use karein:"
    );

    if (!enteredKey || !enteredKey.trim()) {
        return "";
    }

    apiKey = enteredKey.trim();
    return apiKey;
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const question = input.value.trim();
    if (!question) return;

    const key = getApiKey();

    if (!key) {
        addMessage("API key enter nahi ki gayi.", "bot");
        return;
    }

    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();

    addMessage(question, "user");
    chatHistory.push({
        role: "user",
        content: question
    });

    input.value = "";
    sendButton.disabled = true;
    sendButton.textContent = "Wait...";

    const replyBubble = addMessage("AI is thinking...", "bot");

    try {
        const response = await fetch(
            "https://api.groq.com/openai/v1/chat/completions",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + key
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        {
                            role: "system",
                            content:
                                "You are a helpful, friendly AI assistant. " +
                                "Answer clearly and simply. " +
                                "You can answer in Hindi or English."
                        },
                        ...chatHistory
                    ],
                    temperature: 0.7,
                    max_tokens: 1024
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message ||
                "API request failed. Check your key and model."
            );
        }

        const answer =
            data.choices?.[0]?.message?.content ||
            "Sorry, no answer was returned.";

        replyBubble.textContent = answer;

        chatHistory.push({
            role: "assistant",
            content: answer
        });

    } catch (error) {
        replyBubble.textContent =
            "Error: " + error.message +
            "\n\nPlease check your internet, API key and model access.";

        // Remove failed user message from context so it can be retried.
        chatHistory.pop();

    } finally {
        sendButton.disabled = false;
        sendButton.textContent = "Send ➤";
        input.focus();
        messagesBox.scrollTop = messagesBox.scrollHeight;
    }
});

newChatButton.addEventListener("click", function() {
    chatHistory = [];
    messagesBox.innerHTML = "";
    showWelcome();
    input.value = "";
    input.focus();
});
</script>
</body>
</html>
